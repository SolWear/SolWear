services:
  solwear-site:
    build: .
    ports:
      - "127.0.0.1:3002:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - SOLWEAR_DATA_DIR=/data
      - NEXT_PUBLIC_SOLWEAR_DYNAMIC=1
      - SOLWEAR_STATIC_EXPORT=0
      - PINBOARD_AUTO_APPROVE=${PINBOARD_AUTO_APPROVE:-1}
      - X_CLIENT_ID=${X_CLIENT_ID}
      - X_CLIENT_SECRET=${X_CLIENT_SECRET}
      - X_CALLBACK_URL=${X_CALLBACK_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - SOLWEAR_X_USER_ID=${SOLWEAR_X_USER_ID}
      - PINBOARD_ADMIN_TOKEN=${PINBOARD_ADMIN_TOKEN:-}
    volumes:
      - emails_data:/data
    restart: unless-stopped

volumes:
  emails_data:
    driver: local
