services:
  solwear-site:
    build:
      context: .
      args:
        # Must be passed at build time; see the note in the Dockerfile.
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    ports:
      - "127.0.0.1:3002:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - SOLWEAR_DATA_DIR=/data
      - NEXT_PUBLIC_SOLWEAR_DYNAMIC=1
      - SOLWEAR_STATIC_EXPORT=0
      - PINBOARD_AUTO_APPROVE=${PINBOARD_AUTO_APPROVE:-1}
      - X_API_KEY=${X_API_KEY}
      - X_API_SECRET=${X_API_SECRET}
      - X_CALLBACK_URL=${X_CALLBACK_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - SOLWEAR_X_USER_ID=${SOLWEAR_X_USER_ID}
      - PINBOARD_ADMIN_TOKEN=${PINBOARD_ADMIN_TOKEN:-}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
    volumes:
      - emails_data:/data
    restart: unless-stopped

volumes:
  emails_data:
    driver: local
